[project]
name = "breakdown"
version = "0.1.0"
description = "OneShot Breakdown: contract-governed eight-stage workflow from request to synchronized build"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6",
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breakdown"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261113",
]

[project.scripts]
breakdown = "breakdown.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".breakdown"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S101", "RUF012"]
"evals/**" = ["E501", "S101", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["breakdown"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["breakdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --basetemp: C:\Users\itz15\AppData\Local\Temp denies pytest its root dir
# (WinError 5); keep scratch space project-local and gitignored instead.
addopts = "-q --import-mode=importlib --basetemp=.pytest-tmp"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
